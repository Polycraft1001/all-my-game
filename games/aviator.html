<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🛩️ Aviator Premium</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: radial-gradient(ellipse at center, #1a1a2e 0%, #16213e 50%, #0f0f23 100%);
            color: white;
            overflow: hidden;
            height: 100vh;
        }

        .game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            z-index: 100;
        }

        .logo {
            font-size: 1.8em;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .balance {
            display: flex;
            align-items: center;
            gap: 20px;
            font-size: 1.2em;
            font-weight: 600;
        }

        .balance-item {
            background: rgba(255,255,255,0.2);
            padding: 8px 15px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
        }

        .game-area {
            flex: 1;
            position: relative;
            overflow: hidden;
            background: linear-gradient(180deg, #87CEEB 0%, #4169E1 30%, #1e3c72 70%, #2a5298 100%);
        }

        .clouds {
            position: absolute;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .cloud {
            position: absolute;
            background: rgba(255,255,255,0.8);
            border-radius: 50px;
            opacity: 0.6;
            animation: float 20s infinite linear;
        }

        .cloud:before {
            content: '';
            position: absolute;
            background: rgba(255,255,255,0.8);
            border-radius: 50px;
        }

        .cloud1 {
            width: 80px;
            height: 40px;
            top: 10%;
            animation-delay: -5s;
        }

        .cloud1:before {
            width: 50px;
            height: 50px;
            top: -25px;
            left: 15px;
        }

        .cloud2 {
            width: 60px;
            height: 30px;
            top: 20%;
            animation-delay: -15s;
        }

        .cloud2:before {
            width: 35px;
            height: 35px;
            top: -18px;
            right: 10px;
        }

        .cloud3 {
            width: 100px;
            height: 50px;
            top: 30%;
            animation-delay: -10s;
        }

        .cloud3:before {
            width: 60px;
            height: 60px;
            top: -30px;
            left: 20px;
        }

        @keyframes float {
            0% { transform: translateX(-120px); }
            100% { transform: translateX(calc(100vw + 120px)); }
        }

        .airplane {
            position: absolute;
            width: 80px;
            height: 40px;
            bottom: 100px;
            left: 50px;
            transition: all 0.1s ease-out;
            z-index: 10;
        }

        .airplane-svg {
            width: 100%;
            height: 100%;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.3));
        }

        .multiplier-display {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 4em;
            font-weight: bold;
            text-shadow: 0 0 20px rgba(255,255,255,0.5);
            color: #00ff88;
            z-index: 20;
        }

        .trajectory {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 5;
        }

        .trail {
            stroke: rgba(255,255,255,0.6);
            stroke-width: 3;
            fill: none;
            filter: drop-shadow(0 0 5px rgba(255,255,255,0.8));
        }

        .controls {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            padding: 20px 30px;
            display: flex;
            gap: 20px;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 -4px 20px rgba(0,0,0,0.3);
        }

        .bet-controls {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .bet-input {
            background: rgba(255,255,255,0.1);
            border: 2px solid rgba(255,255,255,0.3);
            color: white;
            padding: 12px 20px;
            border-radius: 25px;
            font-size: 1em;
            width: 120px;
            text-align: center;
            backdrop-filter: blur(10px);
        }

        .bet-input:focus {
            outline: none;
            border-color: #00ff88;
            box-shadow: 0 0 0 3px rgba(0,255,136,0.2);
        }

        .btn {
            padding: 12px 25px;
            border: none;
            border-radius: 25px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            backdrop-filter: blur(10px);
        }

        .btn-primary {
            background: linear-gradient(135deg, #00ff88 0%, #00cc6a 100%);
            color: white;
            box-shadow: 0 4px 20px rgba(0,255,136,0.3);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(0,255,136,0.4);
        }

        .btn-danger {
            background: linear-gradient(135deg, #ff4757 0%, #ff3838 100%);
            color: white;
            box-shadow: 0 4px 20px rgba(255,71,87,0.3);
        }

        .btn-danger:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(255,71,87,0.4);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }

        .game-stats {
            display: flex;
            gap: 30px;
            align-items: center;
        }

        .stat-item {
            text-align: center;
        }

        .stat-label {
            font-size: 0.8em;
            opacity: 0.7;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .stat-value {
            font-size: 1.4em;
            font-weight: bold;
            margin-top: 2px;
        }

        .crash-message {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 3em;
            font-weight: bold;
            color: #ff4757;
            text-shadow: 0 0 20px rgba(255,71,87,0.8);
            opacity: 0;
            animation: crashPulse 2s ease-in-out;
            z-index: 30;
        }

        @keyframes crashPulse {
            0% { opacity: 0; transform: translate(-50%, -50%) scale(0.5); }
            50% { opacity: 1; transform: translate(-50%, -50%) scale(1.2); }
            100% { opacity: 0; transform: translate(-50%, -50%) scale(1); }
        }

        .history {
            position: absolute;
            top: 80px;
            right: 20px;
            background: rgba(0,0,0,0.7);
            padding: 15px;
            border-radius: 10px;
            backdrop-filter: blur(10px);
            max-height: 300px;
            overflow-y: auto;
            z-index: 50;
        }

        .history-title {
            font-weight: bold;
            margin-bottom: 10px;
            color: #00ff88;
        }

        .history-item {
            display: flex;
            justify-content: space-between;
            padding: 5px 0;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .explosion {
            position: absolute;
            pointer-events: none;
            z-index: 25;
        }

        .particle {
            position: absolute;
            width: 6px;
            height: 6px;
            background: #ff4757;
            border-radius: 50%;
            animation: explode 1s ease-out forwards;
        }

        @keyframes explode {
            0% {
                opacity: 1;
                transform: scale(1);
            }
            100% {
                opacity: 0;
                transform: scale(0);
            }
        }

        @media (max-width: 768px) {
            .controls {
                flex-direction: column;
                gap: 15px;
            }
            
            .bet-controls {
                width: 100%;
                justify-content: center;
            }
            
            .game-stats {
                gap: 20px;
            }
            
            .multiplier-display {
                font-size: 3em;
            }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="header">
            <div class="logo">
                ✈️ AVIATOR PREMIUM
            </div>
            <div class="balance">
                <div class="balance-item">💰 <span id="balance">1000</span>€</div>
                <div class="balance-item">🏆 <span id="totalWin">0</span>€</div>
            </div>
        </div>

        <div class="game-area">
            <div class="clouds">
                <div class="cloud cloud1"></div>
                <div class="cloud cloud2"></div>
                <div class="cloud cloud3"></div>
            </div>

            <div class="airplane" id="airplane">
                <svg class="airplane-svg" viewBox="0 0 100 50" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <linearGradient id="planeGradient" x1="0%" y1="0%" x2="100%" y2="0%">
                            <stop offset="0%" style="stop-color:#ff6b6b"/>
                            <stop offset="50%" style="stop-color:#feca57"/>
                            <stop offset="100%" style="stop-color:#48dbfb"/>
                        </linearGradient>
                    </defs>
                    <path d="M10 25 L70 15 L85 20 L90 25 L85 30 L70 35 L10 25 Z" fill="url(#planeGradient)"/>
                    <path d="M20 25 L30 10 L40 25 Z" fill="url(#planeGradient)"/>
                    <path d="M20 25 L30 40 L40 25 Z" fill="url(#planeGradient)"/>
                    <circle cx="75" cy="25" r="3" fill="#fff"/>
                </svg>
            </div>

            <svg class="trajectory" id="trajectory">
                <path class="trail" id="trail" d=""></path>
            </svg>

            <div class="multiplier-display" id="multiplier">1.00x</div>
            
            <div id="crashMessage"></div>
        </div>

        <div class="history" id="history">
            <div class="history-title">📊 Derniers vols</div>
            <div id="historyList"></div>
        </div>

        <div class="controls">
            <div class="bet-controls">
                <input type="number" id="betAmount" class="bet-input" value="10" min="1" max="1000">
                <button class="btn btn-primary" id="betBtn">🚀 Parier</button>
                <button class="btn btn-danger" id="cashoutBtn" disabled>💸 Encaisser</button>
            </div>

            <div class="game-stats">
                <div class="stat-item">
                    <div class="stat-label">Mise actuelle</div>
                    <div class="stat-value" id="currentBet">0€</div>
                </div>
                <div class="stat-item">
                    <div class="stat-label">Gain potentiel</div>
                    <div class="stat-value" id="potentialWin">0€</div>
                </div>
                <div class="stat-item">
                    <div class="stat-label">Statut</div>
                    <div class="stat-value" id="gameStatus">En attente</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        class AviatorGame {
            constructor() {
                this.balance = 1000;
                this.totalWinnings = 0;
                this.currentBet = 0;
                this.currentMultiplier = 1.00;
                this.isFlying = false;
                this.hasBet = false;
                this.crashPoint = 0;
                this.flightHistory = [];
                this.animationId = null;
                this.startTime = 0;
                this.trailPoints = [];
                
                this.initializeElements();
                this.attachEventListeners();
                this.updateDisplay();
                this.loadHistory();
            }

            initializeElements() {
                this.elements = {
                    balance: document.getElementById('balance'),
                    totalWin: document.getElementById('totalWin'),
                    betAmount: document.getElementById('betAmount'),
                    betBtn: document.getElementById('betBtn'),
                    cashoutBtn: document.getElementById('cashoutBtn'),
                    currentBet: document.getElementById('currentBet'),
                    potentialWin: document.getElementById('potentialWin'),
                    gameStatus: document.getElementById('gameStatus'),
                    multiplier: document.getElementById('multiplier'),
                    airplane: document.getElementById('airplane'),
                    trail: document.getElementById('trail'),
                    historyList: document.getElementById('historyList'),
                    crashMessage: document.getElementById('crashMessage')
                };
            }

            attachEventListeners() {
                this.elements.betBtn.addEventListener('click', () => this.placeBet());
                this.elements.cashoutBtn.addEventListener('click', () => this.cashOut());
                
                // Raccourcis clavier
                document.addEventListener('keydown', (e) => {
                    if (e.code === 'Space') {
                        e.preventDefault();
                        if (this.hasBet && this.isFlying) {
                            this.cashOut();
                        } else if (!this.isFlying) {
                            this.placeBet();
                        }
                    }
                });

                // Auto-start nouveau vol
                setInterval(() => {
                    if (!this.isFlying) {
                        this.startFlight();
                    }
                }, 3000);
            }

            placeBet() {
                const betAmount = parseFloat(this.elements.betAmount.value);
                
                if (betAmount <= 0 || betAmount > this.balance) {
                    this.showMessage('Mise invalide !', 'error');
                    return;
                }

                if (this.isFlying) {
                    this.showMessage('Vol en cours !', 'error');
                    return;
                }

                this.currentBet = betAmount;
                this.balance -= betAmount;
                this.hasBet = true;
                
                this.updateDisplay();
                this.updateButtonStates();
                this.showMessage(`Pari placé: ${betAmount}€`, 'success');
            }

            startFlight() {
                if (this.isFlying) return;

                this.isFlying = true;
                this.currentMultiplier = 1.00;
                this.crashPoint = this.generateCrashPoint();
                this.startTime = Date.now();
                this.trailPoints = [{x: 50, y: window.innerHeight - 100}];
                
                this.elements.gameStatus.textContent = '🛩️ En vol';
                this.updateButtonStates();
                
                this.animateFlight();
            }

            generateCrashPoint() {
                // Algorithme réaliste pour générer le point de crash
                const rand = Math.random();
                
                if (rand < 0.5) return 1.00 + Math.random() * 1.5; // 50% chance: 1.00-2.50x
                if (rand < 0.8) return 2.50 + Math.random() * 2.5; // 30% chance: 2.50-5.00x
                if (rand < 0.95) return 5.00 + Math.random() * 5.0; // 15% chance: 5.00-10.00x
                return 10.00 + Math.random() * 40.0; // 5% chance: 10.00-50.00x
            }

            animateFlight() {
                const animate = () => {
                    if (!this.isFlying) return;

                    const elapsedTime = (Date.now() - this.startTime) / 1000;
                    this.currentMultiplier = 1 + (elapsedTime * elapsedTime * 0.1);

                    if (this.currentMultiplier >= this.crashPoint) {
                        this.crash();
                        return;
                    }

                    this.updateFlightAnimation();
                    this.updateDisplay();
                    
                    this.animationId = requestAnimationFrame(animate);
                };

                animate();
            }

            updateFlightAnimation() {
                const progress = Math.min(this.currentMultiplier / 10, 0.9);
                const x = 50 + (progress * (window.innerWidth - 200));
                const y = (window.innerHeight - 100) - (progress * (window.innerHeight - 200));
                
                // Mise à jour position avion
                this.elements.airplane.style.left = x + 'px';
                this.elements.airplane.style.bottom = (window.innerHeight - y) + 'px';
                this.elements.airplane.style.transform = `rotate(${-progress * 45}deg)`;
                
                // Mise à jour traînée
                this.trailPoints.push({x, y});
                if (this.trailPoints.length > 50) {
                    this.trailPoints.shift();
                }
                
                const pathData = this.trailPoints.reduce((path, point, index) => {
                    return path + (index === 0 ? `M ${point.x} ${point.y}` : ` L ${point.x} ${point.y}`);
                }, '');
                
                this.elements.trail.setAttribute('d', pathData);
            }

            crash() {
                this.isFlying = false;
                this.showCrashAnimation();
                
                if (this.hasBet) {
                    this.showMessage(`💥 Crash à ${this.crashPoint.toFixed(2)}x ! Mise perdue.`, 'error');
                } else {
                    this.showMessage(`💥 Crash à ${this.crashPoint.toFixed(2)}x !`, 'info');
                }
                
                this.addToHistory(this.crashPoint);
                this.resetRound();
            }

            showCrashAnimation() {
                // Message de crash
                this.elements.crashMessage.textContent = '💥 CRASH!';
                this.elements.crashMessage.style.animation = 'none';
                setTimeout(() => {
                    this.elements.crashMessage.style.animation = 'crashPulse 2s ease-in-out';
                }, 10);

                // Particules d'explosion
                this.createExplosion();
            }

            createExplosion() {
                const airplane = this.elements.airplane;
                const rect = airplane.getBoundingClientRect();
                const centerX = rect.left + rect.width / 2;
                const centerY = rect.top + rect.height / 2;

                for (let i = 0; i < 15; i++) {
                    const particle = document.createElement('div');
                    particle.className = 'particle';
                    particle.style.left = centerX + 'px';
                    particle.style.top = centerY + 'px';
                    
                    const angle = (i / 15) * 2 * Math.PI;
                    const distance = 50 + Math.random() * 100;
                    const endX = centerX + Math.cos(angle) * distance;
                    const endY = centerY + Math.sin(angle) * distance;
                    
                    particle.style.setProperty('--endX', endX + 'px');
                    particle.style.setProperty('--endY', endY + 'px');
                    
                    document.body.appendChild(particle);
                    
                    particle.addEventListener('animationend', () => {
                        document.body.removeChild(particle);
                    });
                }
            }

            cashOut() {
                if (!this.hasBet || !this.isFlying) return;

                const winAmount = this.currentBet * this.currentMultiplier;
                this.balance += winAmount;
                this.totalWinnings += (winAmount - this.currentBet);
                
                this.showMessage(`💰 Encaissé: ${winAmount.toFixed(2)}€ (${this.currentMultiplier.toFixed(2)}x)`, 'success');
                this.hasBet = false;
                
                this.updateDisplay();
                this.updateButtonStates();
            }

            resetRound() {
                this.hasBet = false;
                this.currentBet = 0;
                this.currentMultiplier = 1.00;
                this.trailPoints = [];
                
                // Reset position avion
                this.elements.airplane.style.left = '50px';
                this.elements.airplane.style.bottom = '100px';
                this.elements.airplane.style.transform = 'rotate(0deg)';
                this.elements.trail.setAttribute('d', '');
                
                this.elements.gameStatus.textContent = '⏳ En attente';
                this.updateDisplay();
                this.updateButtonStates();
            }

            addToHistory(crashPoint) {
                this.flightHistory.unshift({
                    multiplier: crashPoint,
                    timestamp: new Date().toLocaleTimeString()
                });
                
                if (this.flightHistory.length > 10) {
                    this.flightHistory.pop();
                }
                
                this.updateHistoryDisplay();
            }

            updateHistoryDisplay() {
                const historyHTML = this.flightHistory.map(flight => `
                    <div class="history-item">
                        <span>${flight.timestamp}</span>
                        <span style="color: ${flight.multiplier >= 2 ? '#00ff88' : '#ff4757'}">${flight.multiplier.toFixed(2)}x</span>
                    </div>
                `).join('');
                
                this.elements.historyList.innerHTML = historyHTML;
            }

            updateDisplay() {
                this.elements.balance.textContent = Math.floor(this.balance);
                this.elements.totalWin.textContent = Math.floor(this.totalWinnings);
                this.elements.currentBet.textContent = this.currentBet + '€';
                this.elements.potentialWin.textContent = (this.currentBet * this.currentMultiplier).toFixed(2) + '€';
                this.elements.multiplier.textContent = this.currentMultiplier.toFixed(2) + 'x';
            }

            updateButtonStates() {
                this.elements.betBtn.disabled = this.isFlying || this.hasBet;
                this.elements.cashoutBtn.disabled = !this.hasBet || !this.isFlying;
            }

            showMessage(message, type) {
                // Système de notification simple
                console.log(`${type.toUpperCase()}: ${message}`);
            }

            loadHistory() {
                // Historique initial pour démonstration
                const initialHistory = [
                    { multiplier: 1.23, timestamp: '14:30:15' },
                    { multiplier: 4.56, timestamp: '14:29:42' },
                    { multiplier: 1.89, timestamp: '14:29:08' },
                    { multiplier: 2.34, timestamp: '14:28:33' }
                ];
                
                this.flightHistory = initialHistory;
                this.updateHistoryDisplay();
            }
        }

        // Initialiser le jeu
        document.addEventListener('DOMContentLoaded', () => {
            new AviatorGame();
        });
    </script>
</body>
</html>
